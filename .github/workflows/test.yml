name: Test published SCAD toolchain

on:
  push:
    branches:
      - main
    tags:
      - 'test-v*-toolchain-v*'
  pull_request:
  workflow_dispatch:
    inputs:
      toolchain_version:
        description: 'Optional toolchain version override, e.g. v0.2.0'
        required: false
        type: string

permissions:
  contents: write
  packages: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      image: ${{ steps.config.outputs.image }}
      version: ${{ steps.config.outputs.version }}
      container: ${{ steps.config.outputs.container }}
      suite_version: ${{ steps.config.outputs.suite_version }}
    steps:
      - uses: actions/checkout@v4

      - id: config
        shell: bash
        env:
          OVERRIDE_VERSION: ${{ inputs.toolchain_version }}
        run: |
          set -euo pipefail
          source ./toolchain.env

          VERSION="${SCAD_TOOLCHAIN_VERSION}"
          if [[ -n "${OVERRIDE_VERSION:-}" ]]; then
            VERSION="${OVERRIDE_VERSION}"
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            SUITE_VERSION="${GITHUB_REF_NAME}"
          else
            SUITE_VERSION="latest"
          fi

          echo "image=${SCAD_TOOLCHAIN_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "container=${SCAD_TOOLCHAIN_IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
          echo "suite_version=${SUITE_VERSION}" >> "$GITHUB_OUTPUT"

          echo "Test suite     : ${SUITE_VERSION}"
          echo "Toolchain      : ${SCAD_TOOLCHAIN_IMAGE}:${VERSION}"

  test:
    needs: resolve
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.resolve.outputs.container }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Run external consumer tests
        run: bash ./scripts/run-tests.sh

      - name: Build HTML report
        env:
          TEST_SUITE_VERSION: ${{ needs.resolve.outputs.suite_version }}
          SCAD_TOOLCHAIN_IMAGE: ${{ needs.resolve.outputs.image }}
          SCAD_TOOLCHAIN_VERSION: ${{ needs.resolve.outputs.version }}
        run: bash ./scripts/build-report.sh

      - name: Upload raw test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scad-toolchain-test-output-${{ needs.resolve.outputs.suite_version }}
          path: out/
          if-no-files-found: warn

      - name: Upload report for publish job
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: scad-toolchain-test-site
          path: site/
          if-no-files-found: error

  publish:
    needs: [resolve, test]
    if: success() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    concurrency:
      group: pages-publish
      cancel-in-progress: false
  
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          path: source
  
      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: scad-toolchain-test-site
          path: report
  
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
        continue-on-error: true
  
      - name: Initialize Pages tree if needed
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d pages/.git ]]; then
            rm -rf pages
            mkdir pages
          fi
  
      - name: Update report directory
        shell: bash
        run: |
          set -euo pipefail
          DEST="pages/${{ needs.resolve.outputs.suite_version }}"
          rm -rf "${DEST}"
          mkdir -p "${DEST}"
          cp -a report/. "${DEST}/"
  
      - name: Build root index
        shell: bash
        run: |
          set -euo pipefail
          bash source/scripts/build-index.sh pages
  
      - name: Publish Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          publish_branch: gh-pages
          keep_files: true
          force_orphan: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
