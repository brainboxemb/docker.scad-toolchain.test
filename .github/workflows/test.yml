name: Test

on:
  push:
    branches:
      - main
    tags:
      - 'test-v*-toolchain-v*'
  pull_request:
  workflow_dispatch:
    inputs:
      toolchain_version:
        description: 'Optional toolchain version override, e.g. edge, sha-abc1234 or v0.5.0'
        required: false
        type: string

permissions:
  contents: write
  packages: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      suite_version: ${{ steps.config.outputs.suite_version }}
      version: ${{ steps.config.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Resolve runtime images
        id: config
        timeout-minutes: 2
        shell: bash
        env:
          OVERRIDE_VERSION: ${{ inputs.toolchain_version }}
        run: |
          set -euo pipefail
          source ./toolchain.env

          VERSION="${SCAD_TOOLCHAIN_VERSION}"
          SUITE_VERSION="latest"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            SUITE_VERSION="${GITHUB_REF_NAME}"

            if [[ "${GITHUB_REF_NAME}" =~ ^test-v.+-toolchain-(v.+)$ ]]; then
              VERSION="${BASH_REMATCH[1]}"
            else
              echo "ERROR: unsupported test tag format: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          fi

          if [[ -n "${OVERRIDE_VERSION:-}" ]]; then
            VERSION="${OVERRIDE_VERSION}"
          fi

          OPENSCAD_CONTAINER="${SCAD_TOOLCHAIN_OPENSCAD_IMAGE}:${VERSION}"
          FULL_CONTAINER="${SCAD_TOOLCHAIN_FULL_IMAGE}:${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "suite_version=${SUITE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "openscad_container=${OPENSCAD_CONTAINER}" >> "$GITHUB_OUTPUT"
          echo "full_container=${FULL_CONTAINER}" >> "$GITHUB_OUTPUT"

          echo "Test suite       : ${SUITE_VERSION}"
          echo "OpenSCAD runtime : ${OPENSCAD_CONTAINER}"
          echo "Full runtime     : ${FULL_CONTAINER}"

      - name: Log in to GHCR
        timeout-minutes: 2
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and measure both runtime images
        timeout-minutes: 5
        shell: bash
        env:
          OPENSCAD_CONTAINER: ${{ steps.config.outputs.openscad_container }}
          FULL_CONTAINER: ${{ steps.config.outputs.full_container }}
        run: |
          set -euo pipefail
          mkdir -p out
          : > out/image-metrics.txt

          measure_image() {
            local profile="$1"
            local image="$2"
            local start end elapsed unpacked raw media digest compressed

            start="$(date +%s%3N)"
            docker pull "$image"
            end="$(date +%s%3N)"
            elapsed=$((end - start))
            unpacked="$(docker image inspect --format='{{.Size}}' "$image")"

            raw="$(docker buildx imagetools inspect --raw "$image")"
            media="$(printf '%s' "$raw" | jq -r '.mediaType // empty')"
            if [[ "$media" == *image.index* || "$media" == *manifest.list* ]]; then
              digest="$(printf '%s' "$raw" | jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' | head -n1)"
              test -n "$digest"
              raw="$(docker buildx imagetools inspect --raw "${image%@*}@${digest}")"
            fi
            compressed="$(printf '%s' "$raw" | jq '[.layers[].size] | add')"

            printf '%s image=%s pull_ms=%s compressed_bytes=%s unpacked_bytes=%s\n' \
              "$profile" "$image" "$elapsed" "$compressed" "$unpacked" \
              | tee -a out/image-metrics.txt
          }

          measure_image openscad "$OPENSCAD_CONTAINER"
          measure_image full "$FULL_CONTAINER"

      - name: Test OpenSCAD runtime contract
        timeout-minutes: 5
        shell: bash
        env:
          CONTAINER: ${{ steps.config.outputs.openscad_container }}
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e SCAD_TOOLCHAIN_PROFILE=openscad \
            -e SCAD_TOOLCHAIN_TEST_OUT=/work/out/openscad-profile \
            "$CONTAINER" \
            bash ./scripts/run-tests.sh

      - name: Test full runtime contract
        timeout-minutes: 5
        shell: bash
        env:
          CONTAINER: ${{ steps.config.outputs.full_container }}
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e SCAD_TOOLCHAIN_PROFILE=full \
            -e SCAD_TOOLCHAIN_TEST_OUT=/work/out/full-profile \
            "$CONTAINER" \
            bash ./scripts/run-tests.sh

      - name: Build combined HTML report
        timeout-minutes: 2
        shell: bash
        env:
          CONTAINER: ${{ steps.config.outputs.full_container }}
          TEST_SUITE_VERSION: ${{ steps.config.outputs.suite_version }}
          SCAD_TOOLCHAIN_VERSION: ${{ steps.config.outputs.version }}
          OPENSCAD_CONTAINER: ${{ steps.config.outputs.openscad_container }}
          FULL_CONTAINER: ${{ steps.config.outputs.full_container }}
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e TEST_SUITE_VERSION \
            -e SCAD_TOOLCHAIN_VERSION \
            -e OPENSCAD_CONTAINER \
            -e FULL_CONTAINER \
            "$CONTAINER" \
            bash ./scripts/build-report.sh

      - name: Upload raw test output
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scad-toolchain-test-output-${{ steps.config.outputs.suite_version }}
          path: out/
          if-no-files-found: warn

      - name: Upload report for publish job
        timeout-minutes: 2
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: scad-toolchain-test-site
          path: site/
          if-no-files-found: error

  publish:
    needs: test
    if: success() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pages-publish
      cancel-in-progress: false

    steps:
      - name: Checkout source branch
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          path: source

      - name: Download report
        timeout-minutes: 2
        uses: actions/download-artifact@v4
        with:
          name: scad-toolchain-test-site
          path: report

      - name: Checkout gh-pages branch
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
        continue-on-error: true

      - name: Initialize Pages tree if needed
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -d pages/.git ]]; then
            rm -rf pages
            mkdir pages
          fi

      - name: Update report directory
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          DEST="pages/${{ needs.test.outputs.suite_version }}"
          rm -rf "${DEST}"
          mkdir -p "${DEST}"
          cp -a report/. "${DEST}/"

      - name: Build root index
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          bash source/scripts/build-index.sh pages

      - name: Publish Pages branch
        timeout-minutes: 5
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./pages
          publish_branch: gh-pages
          keep_files: true
          force_orphan: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
