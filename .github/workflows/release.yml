name: Release

on:
  workflow_dispatch:
    inputs:
      suite_version:
        description: 'Test-suite version, e.g. v0.4.0'
        required: true
        type: string
      toolchain_version:
        description: 'Immutable toolchain version, e.g. v0.4.0'
        required: true
        type: string
      release_sha:
        description: 'Exact already-verified test-suite commit SHA to tag'
        required: true
        type: string
  push:
    branches:
      - 'release-request/**'

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout release workflow ref with full history
        timeout-minutes: 2
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate release request
        id: release
        timeout-minutes: 2
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SUITE_VERSION: ${{ inputs.suite_version }}
          INPUT_TOOLCHAIN_VERSION: ${{ inputs.toolchain_version }}
          INPUT_RELEASE_SHA: ${{ inputs.release_sha }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "push" ]]; then
            if [[ "${ACTOR}" != "${REPOSITORY_OWNER}" ]]; then
              echo "ERROR: release-request branches may only be created by ${REPOSITORY_OWNER}" >&2
              exit 1
            fi

            REQUEST="${REF_NAME#release-request/}"
            IFS='/' read -r SUITE_VERSION TOOLCHAIN_VERSION RELEASE_SHA EXTRA <<< "${REQUEST}"

            if [[ "${REQUEST}" == "${REF_NAME}" || -z "${SUITE_VERSION}" || -z "${TOOLCHAIN_VERSION}" || -z "${RELEASE_SHA}" || -n "${EXTRA:-}" ]]; then
              echo "ERROR: release request branch must be release-request/vX.Y.Z/vX.Y.Z/<40-char-sha>" >&2
              exit 1
            fi
          else
            SUITE_VERSION="${INPUT_SUITE_VERSION}"
            TOOLCHAIN_VERSION="${INPUT_TOOLCHAIN_VERSION}"
            RELEASE_SHA="${INPUT_RELEASE_SHA}"
          fi

          for value in "${SUITE_VERSION}" "${TOOLCHAIN_VERSION}"; do
            if [[ ! "${value}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "ERROR: versions must match vX.Y.Z" >&2
              exit 1
            fi
          done

          if [[ ! "${RELEASE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: release_sha must be an exact 40-character commit SHA" >&2
            exit 1
          fi

          RELEASE_TAG="test-${SUITE_VERSION}-toolchain-${TOOLCHAIN_VERSION}"

          git fetch --tags --force origin

          if ! git cat-file -e "${RELEASE_SHA}^{commit}" 2>/dev/null; then
            echo "ERROR: release_sha is not a known commit: ${RELEASE_SHA}" >&2
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "ERROR: release tag already exists: ${RELEASE_TAG}" >&2
            exit 1
          fi

          echo "suite_version=${SUITE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "toolchain_version=${TOOLCHAIN_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_sha=${RELEASE_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Verification release request validated: ${RELEASE_TAG} @ ${RELEASE_SHA}"

      - name: Create annotated verification tag
        timeout-minutes: 2
        env:
          SUITE_VERSION: ${{ steps.release.outputs.suite_version }}
          TOOLCHAIN_VERSION: ${{ steps.release.outputs.toolchain_version }}
          RELEASE_SHA: ${{ steps.release.outputs.release_sha }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${RELEASE_TAG}" "${RELEASE_SHA}" \
            -m "SCAD toolchain test suite ${SUITE_VERSION} for toolchain ${TOOLCHAIN_VERSION}"
          git push origin "refs/tags/${RELEASE_TAG}"

      - name: Dispatch authoritative test workflow on release tag
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          set -euo pipefail

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/dispatches" \
            -f ref="${RELEASE_TAG}"

          echo "Dispatched test.yml on ${RELEASE_TAG}."

      - name: Remove release request branch
        if: ${{ always() && github.event_name == 'push' }}
        timeout-minutes: 2
        env:
          REQUEST_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git push origin --delete "${REQUEST_BRANCH}" || true
