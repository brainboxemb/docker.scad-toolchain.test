name: One-shot release test-v0.4.0-toolchain-v0.4.0

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create immutable test-suite tag
        env:
          RELEASE_SHA: 9759fef1c4098ffc9d6a656f44cb89c006c9216c
          RELEASE_TAG: test-v0.4.0-toolchain-v0.4.0
        run: |
          set -euo pipefail
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "${RELEASE_TAG} already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${RELEASE_TAG}" "${RELEASE_SHA}" -m "SCAD toolchain test suite v0.4.0 for toolchain v0.4.0"
            git push origin "refs/tags/${RELEASE_TAG}"
          fi

      - name: Dispatch normal test workflow on released tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: test-v0.4.0-toolchain-v0.4.0
        run: |
          set -euo pipefail
          gh api             --method POST             "repos/${GITHUB_REPOSITORY}/actions/workflows/test.yml/dispatches"             -f ref="${RELEASE_TAG}"
